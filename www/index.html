<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#174a3a">
<title>GeoField | دفترچه صحرایی</title>
<style>
:root{--green:#174a3a;--green2:#22664f;--bg:#f3f6f4;--line:#dce5df;--ink:#20352c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
header{background:var(--green);color:white;padding:22px 18px 20px}header h1{margin:0 0 6px;font-size:24px}header p{margin:0;color:#d7e9df;font-size:13px}
main{max-width:760px;margin:auto;padding:16px}
.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:15px;box-shadow:0 3px 12px #163c2910}
h2{font-size:17px;margin:0 0 14px}.field{margin-bottom:12px}label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}
input,textarea{width:100%;border:1px solid #cbd8d0;border-radius:9px;padding:11px;font:14px Tahoma;background:#fff;color:var(--ink)}
textarea{min-height:78px;resize:vertical}input:focus,textarea:focus{outline:2px solid #a9cbb7;border-color:var(--green2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:9px;padding:11px 14px;font: bold 13px Tahoma;cursor:pointer;background:var(--green);color:white}
button.secondary{background:#e8efea;color:var(--green)}button.danger{background:#a33b35}button:disabled{opacity:.5}
.record{border:1px solid var(--line);border-radius:11px;padding:12px;margin:10px 0;background:#fff}
.record h3{font-size:15px;margin:0 0 8px}.record p{font-size:13px;margin:5px 0;line-height:1.7;overflow-wrap:anywhere}
.meta{color:#61756a;font-size:11px}.empty{text-align:center;color:#718078;padding:20px 5px;font-size:13px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.small{font-size:11px;color:#6c7e73}.hidden{display:none!important}
</style>
</head>
<body>
<header><h1>GeoField</h1><p>دفترچه ثبت مشاهدات زمین‌شناسی — قابل استفاده بدون اینترنت</p></header>
<main>
<section class="panel">
<h2 id="formTitle">ثبت مشاهده جدید</h2>
<form id="entryForm">
<div class="field"><label for="rockColor">۱. رنگ سنگ *</label><input id="rockColor" required placeholder="مثلاً خاکستری روشن"></div>
<div class="field"><label for="unitName">۲. نام واحد *</label><input id="unitName" required placeholder="نام سازند یا واحد سنگی"></div>
<div class="field"><label for="minerals">۳. کانی‌های موجود</label><textarea id="minerals" placeholder="کانی‌های قابل تشخیص"></textarea></div>
<div class="field"><label for="alterations">۴. دگرسانی‌های آن</label><textarea id="alterations" placeholder="نوع و شدت دگرسانی"></textarea></div>
<div class="field"><label for="sample">۵. نمونه برداشت‌شده</label><input id="sample" placeholder="کد یا شماره نمونه"></div>
<div class="field"><label for="notes">۶. توضیحات بیشتر</label><textarea id="notes" placeholder="توضیحات صحرایی و نکات تکمیلی"></textarea></div>
<div class="field"><label for="analysis">۷. نوع آنالیز نمونه</label><input id="analysis" placeholder="مثلاً XRF، ICP، مقطع نازک"></div>
<div class="actions"><button type="submit" id="saveBtn">ذخیره مشاهده</button><button type="button" class="secondary hidden" id="cancelEdit">لغو ویرایش</button></div>
</form>
</section>
<section class="panel">
<div class="topline"><h2>مشاهدات ثبت‌شده</h2><span class="small" id="count">۰ رکورد</span></div>
<div class="actions">
<button type="button" id="exportXlsx">خروجی Excel (XLSX)</button>
<button type="button" class="secondary" id="backup">پشتیبان JSON</button>
<button type="button" class="secondary" id="restoreBtn">بازیابی JSON</button>
<input id="restoreFile" type="file" accept="application/json,.json" class="hidden">
<button type="button" class="danger" id="clearAll">حذف همه</button>
</div>
<div id="records"><div class="empty">هنوز مشاهده‌ای ثبت نشده است.</div></div>
</section>
<p class="small" style="text-align:center">اطلاعات روی همین دستگاه ذخیره می‌شود. برای جلوگیری از ازدست‌رفتن داده‌ها، پشتیبان JSON بگیرید.</p>
</main>
<script type="module" src="./bundle.js"></script>
</body></html>
