name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master, feature/secure-storage-2026-11, feature/fieldwork-suite-2026-11 ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Test secure record storage and migration
        run: npm run test:storage
      - name: Bundle web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Integrate Android Keystore storage
        run: node scripts/prepare-android-secure-storage.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoField-secure-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
